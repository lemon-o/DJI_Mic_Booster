[package]
name = "dji_mic_booster"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ringbuf = "0.4"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
